<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceWatch PH Clone</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main-blue: #4f46e5; --accent-orange: #f97316; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; text-align: center; color: #1f2937; }
        
        /* Header Styling */
        .header { background: white; padding: 30px; border-bottom: 1px solid #e5e7eb; }
        .header h1 { color: #5b21b6; margin: 0; font-size: 32px; }
        .sub-header { color: #6b7280; margin-top: 10px; font-size: 14px; }

        /* Search Section */
        .search-container { background: white; margin: 20px auto; padding: 20px; width: 90%; max-width: 800px; border-radius: 20px; display: flex; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; }
        .btn-scan { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* Map Section */
        #map { height: 400px; width: 90%; max-width: 800px; margin: 20px auto; border-radius: 20px; border: 8px solid white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* Store Grid */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .store-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: left; }
        .card-header { background: linear-gradient(90deg, #2563eb, #f97316); color: white; padding: 15px; }
        .card-body { padding: 15px; }
        .distance { font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
        .view-btn { background: #f97316; color: white; width: 100%; border: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; }
        .product-row { display: flex; justify-content: space-between; border-bottom: 1px solid #f3f4f6; padding: 8px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PriceWatch PH</h1>
        <div class="sub-header">Real 2026 prices • 5km scan • Always finds the cheapest</div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search: Lucky Me, 555 Sardines...">
        <button class="btn-scan" onclick="getLocation()">Scan My Location (5km)</button>
    </div>

    <div id="map"></div>

    <div class="store-grid" id="storeGrid">
        <!-- Store Cards appear here -->
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([14.3512, 121.0620], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let storeData = [];
        let userPos = null;

        // Fetch Data
        fetch('prices.json')
            .then(res => res.json())
            .then(data => {
                storeData = data.stores;
                renderStores();
            });

        function renderStores() {
            const grid = document.getElementById('storeGrid');
            grid.innerHTML = '';

            storeData.forEach(store => {
                let distText = userPos ? `${calculateDistance(userPos.lat, userPos.lng, store.lat, store.lng).toFixed(2)}km away` : "Calculating distance...";
                
                const card = `
                    <div class="store-card">
                        <div class="card-header"><h3>${store.name}</h3></div>
                        <div class="card-body">
                            <div class="distance">${distText}</div>
                            <button class="view-btn">View All Products</button>
                            ${store.products.map(p => `
                                <div class="product-row">
                                    <span>${p.name}</span>
                                    <b>₱${p.price.toFixed(2)}</b>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                grid.innerHTML += card;

                // Add markers to map
                L.marker([store.lat, store.lng]).addTo(map).bindPopup(store.name);
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    map.setView([userPos.lat, userPos.lng], 14);
                    L.circle([userPos.lat, userPos.lng], {radius: 5000, color: '#2563eb'}).addTo(map);
                    renderStores(); // Re-render with distances
                });
            }
        }

        // Distance formula (Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
    </script>
</body>
</html>
