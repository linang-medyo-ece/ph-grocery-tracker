<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PH Grocery Price Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f4f4f9; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #3498db; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>
    <h1>🇵🇭 Grocery Price Tracker</h1>
    <p>Latest prices fetched from Philippine supermarkets.</p>
    <div id="table-container">Loading latest prices...</div>

    <script>
        fetch('prices.json')
            .then(res => res.json())
            .then(data => {
                let table = `<table>
                    <thead>
                        <tr><th>Date</th><th>Item</th><th>Store</th><th>Price (PHP)</th></tr>
                    </thead>
                    <tbody>`;
                data.forEach(row => {
                    table += `<tr>
                        <td>${row.date}</td>
                        <td>${row.item}</td>
                        <td>${row.store}</td>
                        <td>₱${row.price.toFixed(2)}</td>
                    </tr>`;
                });
                table += '</tbody></table>';
                document.getElementById('table-container').innerHTML = table;
            });
    </script>
</body>
</html>
